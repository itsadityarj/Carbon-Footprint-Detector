<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Calculator</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/config.js" defer></script>
    <script src="js/calculator.js" defer></script>
</head>

<body>
    <header>
        <div class="myhead">
            <img class="logo" src="images/new208.png">
            <h1 class="mytitle">CarbonCalculator</h1>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="calculator.html">Calculator</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </nav>
    </header>

    <section class="calculator-section">
        <div class="calculator-container" style="text-align: center;">
            <h2>Carbon Footprint Calculator</h2>
            <label style="text-align: left;">For previous 12 months:</label>
            <form id="carbonForm">
                <div class="form-group">
                    <label for="carKm">Distance traveled by car (km):</label>
                    <input type="number" id="carKm" name="carKm" min="0" required>
                </div>
                <div class="form-group">
                    <label for="busKm">Distance traveled by bus (km):</label>
                    <input type="number" id="busKm" name="busKm" min="0" required>
                </div>
                <div class="form-group">
                    <label for="flightKm">Distance traveled by flight (km):</label>
                    <input type="number" id="flightKm" name="flightKm" min="0" required>
                </div>
                <div class="form-group">
                    <label for="electricity">Electricity usage (kWh):</label>
                    <input type="number" id="electricity" name="electricity" min="0" required>
                </div>
                <div class="form-group">
                    <label for="naturalGas">Natural gas usage (therms):</label>
                    <input type="number" id="naturalGas" name="naturalGas" min="0" required>
                </div>
                <div class="form-group">
                    <label for="generalWaste">General waste (kg):</label>
                    <input type="number" id="generalWaste" name="generalWaste" min="0" required>
                </div>
                <div class="form-group">
                    <label for="recycling">Recycled waste (kg):</label>
                    <input type="number" id="recycling" name="recycling" min="0" required>
                </div>
                <button type="button" class="btn" onclick="calculateCarbonFootprint()">Calculate</button>
            </form>
            <div id="result" class="result"></div>
        </div>
    </section>

    <footer style="margin-top: 10%;">
        <p>&copy; 2024 CarbonCalculator</p>
        <p>
            <a href="#">Privacy Policy</a> |
            <a href="#">Terms of Service</a>
        </p>
        <p>
            Follow us:
            <a href="#">Facebook</a>,
            <a href="#">Twitter</a>,
            <a href="#">Instagram</a>
        </p>
    </footer>

</body>
</html>
